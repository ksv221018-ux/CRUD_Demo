
<!DOCTYPE html>
<html>
<head>
    <title>Student Details</title>
</head>
<body>

    <h2>Student Details</h2>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <a href="{% url 'insert' %}">
        <button type="button">Add Student</button>
    </a>

    <br><br>

    <table border="1" cellpadding="10">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Email</th>
            <th>Created At</th>
            <th>Action</th>
        </tr>

        {% for i in data %}
        <tr>
            <td>{{ i.id }}</td>
            <td>{{ i.name }}</td>
            <td>{{ i.age }}</td>
            <td>{{ i.email }}</td>
            <td>{{ i.created_at }}</td>

            <td>
                <a href="{% url 'update' i.id %}">
                    <button type="button">Update</button>
                </a>

                <form method="POST"
                      action="{% url 'delete' i.id %}"
                      style="display:inline;">

                    {% csrf_token %}

                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="6">No student records found</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="{% url 'insert' %}">Back to Insert</a>

</body>
</html>

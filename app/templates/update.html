
<!DOCTYPE html>
<html>
<head>
    <title>Update Student</title>
</head>
<body>

    <h2>Update Student Details</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text"
               name="name"
               value="{{ data.name }}"
               required>
        <br><br>

        <label>Age:</label>
        <input type="number"
               name="age"
               value="{{ data.age }}"
               required>
        <br><br>

        <label>Email:</label>
        <input type="email"
               name="email"
               value="{{ data.email }}"
               required>
        <br><br>

        <button type="submit">Update</button>

    </form>

    <br>

    <a href="{% url 'read' %}">Back to Read</a>

</body>
</html>
